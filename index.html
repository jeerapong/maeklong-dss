<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Dashboard สนับสนุนการตัดสินใจจัดสรรน้ำลุ่มน้ำแม่กลอง เชื่อมผลลัพธ์แบบจำลอง WEAP เข้ากับการพยากรณ์และการหาค่าเหมาะที่สุดด้วย AI">
<meta property="og:title" content="ศูนย์ตัดสินใจจัดสรรน้ำแม่กลอง">
<meta property="og:description" content="Mae Klong Water Allocation DSS · WEAP + AI">
<meta property="og:type" content="website">
<title>ศูนย์ตัดสินใจจัดสรรน้ำแม่กลอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* รีเซ็ตขั้นต่ำ (บนหน้า Artifact ตัวจัดการใส่ให้อยู่แล้ว ไฟล์นี้จึงต้องใส่เอง) */
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0}
  img,svg{max-width:100%}
  button,input,select,textarea{font:inherit;color:inherit}
</style>
</head>
<body>
<style>
:root{
  color-scheme: light;
  --ground:#eaeef1; --surface:#ffffff; --surface-2:#f4f7f9; --surface-3:#e8edf1;
  --ink:#0d1418; --ink-2:#44525a; --ink-3:#75838b;
  --rule:#dae1e6; --rule-2:#bfc9d0; --chip:#e5eaee;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#0a7a0a; --warn-ink:#8a6000; --serious-ink:#a8492a; --crit-ink:#b02c2c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --band:rgba(42,120,214,.16); --band-2:rgba(42,120,214,.10);
  --grid:#e7ecf0; --axis:#c6d0d7;
  --shadow:0 1px 2px rgba(13,20,24,.05), 0 8px 24px -16px rgba(13,20,24,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#090e11; --surface:#151d21; --surface-2:#1b252a; --surface-3:#223037;
    --ink:#eaf1f4; --ink-2:#9fb0b8; --ink-3:#6f8088;
    --rule:#25333a; --rule-2:#38494f; --chip:#223036;
    --good-ink:#3cc23c; --warn-ink:#fab219; --serious-ink:#ec835a; --crit-ink:#e56a6a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --band:rgba(57,135,229,.22); --band-2:rgba(57,135,229,.12);
    --grid:#202c32; --axis:#33454c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#090e11; --surface:#151d21; --surface-2:#1b252a; --surface-3:#223037;
  --ink:#eaf1f4; --ink-2:#9fb0b8; --ink-3:#6f8088;
  --rule:#25333a; --rule-2:#38494f; --chip:#223036;
  --good-ink:#3cc23c; --warn-ink:#fab219; --serious-ink:#ec835a; --crit-ink:#e56a6a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --band:rgba(57,135,229,.22); --band-2:rgba(57,135,229,.12);
  --grid:#202c32; --axis:#33454c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.disp{font-family:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;text-wrap:balance}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}

.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- masthead ---------- */
.mast{border-bottom:1px solid var(--rule);background:var(--surface);position:relative;z-index:5}
.mast-in{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:16px 0 14px}
.brand{display:flex;gap:13px;align-items:center;min-width:0}
.seal{width:40px;height:40px;flex:0 0 40px}
.brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.brand .sub{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em}
.mast-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mock{font-family:"Bai Jamjuree",sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;
  padding:5px 10px;border:1px dashed var(--rule-2);border-radius:3px;color:var(--ink-3);white-space:nowrap}
.stamp{font-size:12px;color:var(--ink-2);white-space:nowrap}
.stamp b{font-weight:600;color:var(--ink)}

/* ---------- instrument strip ---------- */
.strip{background:var(--surface-2);border-bottom:1px solid var(--rule)}
.strip-in{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule)}
.tile{background:var(--surface-2);padding:14px 16px 15px;min-width:0}
.tile .lab{font-family:"Bai Jamjuree",sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.09em;
  color:var(--ink-3);text-transform:uppercase;display:block;margin-bottom:3px}
.tile .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:27px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.tile .val small{font-size:13px;font-weight:400;color:var(--ink-2);letter-spacing:0}
.tile .foot{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.75}
.tile .foot .pill{margin-top:3px}
.spark{display:block;margin-top:6px;width:100%;height:22px}

/* ---------- status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:"Bai Jamjuree",sans-serif;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:2px 8px 2px 6px;border-radius:3px;
  border:1px solid;white-space:nowrap}
.pill svg{width:11px;height:11px;flex:0 0 11px}
.p-good{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.p-warn{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.p-serious{color:var(--serious-ink);border-color:color-mix(in srgb,var(--serious) 45%,transparent);background:color-mix(in srgb,var(--serious) 13%,transparent)}
.p-crit{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:color-mix(in srgb,var(--crit) 11%,transparent)}

/* ---------- tabs ---------- */
.tabs{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  font-family:"Bai Jamjuree",sans-serif;font-size:13.5px;font-weight:500;color:var(--ink-2);
  padding:12px 14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tab[aria-selected="true"] .n{color:var(--ink-2)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}

/* ---------- layout ---------- */
main{padding:22px 0 90px}
.panel[hidden]{display:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-23{grid-template-columns:1.6fr 1fr}
.g-32{grid-template-columns:1fr 1.5fr}

/* ---------- plates (cards) ---------- */
.plate{background:var(--surface);border:1px solid var(--rule);border-radius:5px;box-shadow:var(--shadow);
  padding:16px 17px 17px;min-width:0}
.plate.tight{padding:0}
.eyebrow{font-family:"Bai Jamjuree",sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.plate h3{margin:0 0 2px;font-size:16px;font-weight:600;letter-spacing:-.005em}
.plate .note{font-size:12.5px;color:var(--ink-2);margin:0 0 12px}
.plate-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

/* ---------- exec callout ---------- */
.callout{border:1px solid var(--rule);border-radius:5px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.callout-h{padding:13px 17px 11px;border-bottom:1px solid var(--rule);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.callout-h h2{margin:0;font-size:15.5px;font-weight:600}
.decisions{list-style:none;margin:0;padding:0}
.decisions li{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:start;
  padding:13px 17px;border-bottom:1px solid var(--rule)}
.decisions li:last-child{border-bottom:0}
.decisions .dn{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);padding-top:2px}
.decisions .dt{display:block;font-size:14.5px;font-weight:500;line-height:1.5}
.decisions .dd{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px}

/* ---------- generic table ---------- */
.tbl-scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.data th,table.data td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left;white-space:normal}
table.data thead th{font-family:"Bai Jamjuree",sans-serif;font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule-2)}
table.data td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
table.data tbody tr:hover{background:var(--surface-2)}
table.data tr.hl{background:color-mix(in srgb,var(--s1) 8%,transparent)}
table.data tr.hl:hover{background:color-mix(in srgb,var(--s1) 12%,transparent)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}

/* ---------- chart shell ---------- */
.chart-scroll{overflow-x:auto;margin:0 -4px}
.chart-scroll>svg{display:block;min-width:620px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.legend i.ln{height:3px;border-radius:2px;width:16px}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--surface);border:1px solid var(--rule-2);
  border-radius:4px;box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px;line-height:1.5;
  min-width:130px;opacity:0;transition:opacity .1s}
.tip .th{font-family:"Bai Jamjuree",sans-serif;font-weight:600;font-size:12px;margin-bottom:4px;
  padding-bottom:4px;border-bottom:1px solid var(--rule)}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .tr b{font-family:"IBM Plex Mono",monospace;font-weight:500}
.tip i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}

/* ---------- toggles ---------- */
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;background:none;border:0;font-family:"Bai Jamjuree",sans-serif;font-size:12px;
  font-weight:500;color:var(--ink-2);padding:5px 11px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

/* ---------- AI blocks ---------- */
.ai-tag{display:inline-flex;align-items:center;gap:5px;font-family:"Bai Jamjuree",sans-serif;font-size:10.5px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  border:1px solid var(--rule-2);border-radius:3px;padding:2px 7px}
.ai-tag svg{width:11px;height:11px}
.rec{border:1px solid var(--rule);border-radius:4px;padding:13px 14px;background:var(--surface-2);
  display:grid;gap:7px}
.rec h4{margin:0;font-size:14px;font-weight:600;line-height:1.45}
.rec p{margin:0;font-size:12.5px;color:var(--ink-2)}
.conf{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-2)}
.conf .bar{flex:1;height:5px;background:var(--chip);border-radius:3px;overflow:hidden;max-width:150px}
.conf .bar i{display:block;height:100%;background:var(--ink-2);border-radius:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}

/* ---------- copilot ---------- */
.cop-btn{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;align-items:center;gap:9px;
  background:var(--ink);color:var(--ground);border:0;border-radius:999px;padding:11px 17px 11px 14px;
  font-family:"Bai Jamjuree",sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;
  box-shadow:0 6px 22px -6px rgba(0,0,0,.45)}
.cop-btn svg{width:17px;height:17px}
.cop{position:fixed;inset:auto 0 0 auto;top:0;width:min(430px,100%);height:100%;z-index:70;
  background:var(--surface);border-left:1px solid var(--rule);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s ease;box-shadow:-14px 0 40px -20px rgba(0,0,0,.5)}
.cop.open{transform:none}
.cop-h{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:10px}
.cop-h h3{margin:0;font-size:15px;font-weight:600}
.cop-h .x{appearance:none;background:none;border:1px solid var(--rule-2);border-radius:4px;color:var(--ink-2);
  width:28px;height:28px;cursor:pointer;font-size:15px;line-height:1}
.cop-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;font-size:13.5px;line-height:1.6}
.msg.u{align-self:flex-end;background:var(--chip);border-radius:12px 12px 3px 12px;padding:9px 12px}
.msg.a{align-self:flex-start;border:1px solid var(--rule);border-radius:12px 12px 12px 3px;padding:11px 13px;background:var(--surface-2)}
.msg.a .src{margin-top:8px;padding-top:7px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-3)}
.msg.a ul{margin:7px 0 0;padding-left:18px}
.msg.a li{margin-bottom:3px}
.cop-f{border-top:1px solid var(--rule);padding:11px 14px;display:flex;flex-wrap:wrap;gap:7px}
.chipq{appearance:none;background:var(--surface-2);border:1px solid var(--rule);border-radius:999px;
  font-family:inherit;font-size:12px;color:var(--ink-2);padding:5px 11px;cursor:pointer;text-align:left}
.chipq:hover{border-color:var(--rule-2);color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(4,8,10,.45);z-index:65;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}

/* ---------- concept tab ---------- */
.prose{font-size:14.5px;line-height:1.75;max-width:68ch}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 12px;padding-left:20px}
.prose li{margin-bottom:5px}
.phase{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.phase:last-child{border-bottom:0}
.phase .pn{font-family:"Bai Jamjuree",sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--ink-3);border:1px solid var(--rule-2);border-radius:3px;padding:3px 8px;height:fit-content;white-space:nowrap}
.phase h4{margin:0 0 3px;font-size:14.5px;font-weight:600}
.phase p{margin:0;font-size:13px;color:var(--ink-2)}

.foot{border-top:1px solid var(--rule);background:var(--surface);padding:18px 0;font-size:12.5px;color:var(--ink-3)}

@media(max-width:700px){
  .decisions li{grid-template-columns:24px 1fr}
  .decisions li>span:last-child{grid-column:2}
}
@media(max-width:900px){
  .g2,.g3,.g-23,.g-32{grid-template-columns:1fr}
  .strip-in{grid-template-columns:1fr 1fr}
  .tile .val{font-size:23px}
}
@media(max-width:560px){
  .brand h1{font-size:16.5px}
  .mock{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="mast"><div class="wrap"><div class="mast-in">
  <div class="brand">
    <svg class="seal" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="38" height="38" rx="4" stroke="currentColor" stroke-opacity=".28"/>
      <path d="M6 26c3.2 0 3.2-3.4 6.4-3.4S15.6 26 18.8 26s3.2-3.4 6.4-3.4S28.4 26 31.6 26M6 31c3.2 0 3.2-3.4 6.4-3.4S15.6 31 18.8 31s3.2-3.4 6.4-3.4S28.4 31 31.6 31" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
      <path d="M11 18V9m0 0-3 3m3-3 3 3M29 9v9m0 0 3-3m-3 3-3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
      <circle cx="20" cy="13.5" r="3.2" stroke="currentColor" stroke-width="1.6"/>
    </svg>
    <div>
      <h1>ศูนย์ตัดสินใจจัดสรรน้ำแม่กลอง</h1>
      <div class="sub">Mae Klong Water Allocation DSS · WEAP + AI</div>
    </div>
  </div>
  <div class="mast-right">
    <span class="mock" id="srcBadge">ข้อมูลจำลองเพื่อการออกแบบ</span>
    <span class="stamp" id="srcStamp">ข้อมูล ณ <b>27 ส.ค. 2569 06:00 น.</b></span>
  </div>
</div></div></div>

<div class="strip"><div class="wrap"><div class="strip-in" id="strip"></div></div></div>

<div class="tabs"><div class="wrap"><div class="tabs-in" role="tablist" id="tabs"></div></div></div>

<main><div class="wrap" id="panels"></div></main>


<button class="cop-btn" id="copBtn" aria-expanded="false" aria-controls="cop">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18 12h3M16.3 7.7l2.1-2.1"/><rect x="6" y="10" width="12" height="9" rx="2.5"/><path d="M10 14v1.5M14 14v1.5"/></svg>
  ถาม AI Copilot
</button>
<div class="scrim" id="scrim"></div>
<aside class="cop" id="cop" aria-label="AI Copilot" aria-hidden="true">
  <div class="cop-h">
    <div>
      <h3>AI Copilot</h3>
      <div style="font-size:11.5px;color:var(--ink-3)">ตอบจากผลจำลอง WEAP + แผนแม่บทลุ่มน้ำแม่กลอง</div>
    </div>
    <button class="x" id="copX" aria-label="ปิด">✕</button>
  </div>
  <div class="cop-body" id="copBody"></div>
  <div class="cop-f" id="copF"></div>
</aside>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   ข้อมูลจำลอง (mock) — สร้างให้สอดคล้องกันเชิงสมดุลมวลน้ำ
   ============================================================ */

/* ============================================================
   เครื่องมือวาดกราฟ (SVG, ไม่ใช้ไลบรารีภายนอก)
   ============================================================ */
const NS='http://www.w3.org/2000/svg';
function E(t,a,st){const n=document.createElementNS(NS,t);
  if(a)for(const k in a){if(a[k]!=null)n.setAttribute(k,a[k]);}
  if(st)for(const k in st){n.style[k]=st[k];}
  return n;}
function svgRoot(w,h){const s=E('svg',{viewBox:`0 0 ${w} ${h}`,role:'img'});s.setAttribute('preserveAspectRatio','xMidYMid meet');return s;}
function nice(v){return v.toLocaleString('th-TH',{maximumFractionDigits:2});}
const AX={size:11.5,fam:'"IBM Plex Mono", monospace'};
function txt(x,y,s,o={}){const t=E('text',{x,y,'text-anchor':o.anchor||'middle','dominant-baseline':o.base||'auto'},
  {fontSize:(o.size||AX.size)+'px',fontFamily:o.fam||AX.fam,fill:o.fill||'var(--ink-3)',fontWeight:o.w||400});
  t.textContent=s;return t;}
function gridline(x1,y1,x2,y2,strong){return E('line',{x1,y1,x2,y2},{stroke:strong?'var(--axis)':'var(--grid)',strokeWidth:'1'});}

/* tooltip */
const TIP=document.getElementById('tip');
function showTip(html,ev){TIP.innerHTML=html;TIP.style.opacity='1';
  const r=TIP.getBoundingClientRect();
  let x=ev.clientX+14, y=ev.clientY-10;
  if(x+r.width>innerWidth-8)x=ev.clientX-r.width-14;
  if(y+r.height>innerHeight-8)y=innerHeight-r.height-8;
  if(y<8)y=8;
  TIP.style.left=x+'px';TIP.style.top=y+'px';}
function hideTip(){TIP.style.opacity='0';}
function tipRow(c,l,v){return `<div class="tr"><span>${c?`<i style="background:${c}"></i>`:''}${l}</span><b>${v}</b></div>`;}

function scroller(svg,minw){const d=document.createElement('div');d.className='chart-scroll';
  if(minw)svg.style.minWidth=minw+'px';d.appendChild(svg);return d;}
function legend(items){const d=document.createElement('div');d.className='legend';
  d.innerHTML=items.map(i=>`<span><i class="${i.line?'ln':''}" style="background:${i.c};${i.dash?'opacity:.6':''}"></i>${i.n}</span>`).join('');
  return d;}

/* ---------- sparkline ---------- */
function sparkline(vals,color,fill){
  const w=200,h=22,mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  const X=i=>i*(w/(vals.length-1)), Y=v=>h-2-((v-mn)/sp)*(h-5);
  const s=svgRoot(w,h);s.setAttribute('class','spark');s.setAttribute('preserveAspectRatio','none');
  const d=vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  if(fill)s.appendChild(E('path',{d:d+`L${w} ${h}L0 ${h}Z`},{fill:color,opacity:.13}));
  s.appendChild(E('path',{d},{fill:'none',stroke:color,strokeWidth:'2',strokeLinejoin:'round',strokeLinecap:'round',vectorEffect:'non-scaling-stroke'}));
  s.appendChild(E('circle',{cx:X(vals.length-1),cy:Y(vals[vals.length-1]),r:3},{fill:color}));
  return s;
}

/* ---------- crosshair helper ---------- */
function crosshair(svg,{x0,x1,y0,y1,n,X,render}){
  const line=E('line',{x1:0,y1:y0,x2:0,y2:y1},{stroke:'var(--ink-3)',strokeWidth:'1',opacity:'0',pointerEvents:'none'});
  svg.appendChild(line);
  const rect=E('rect',{x:x0,y:y0,width:x1-x0,height:y1-y0},{fill:'transparent',cursor:'crosshair'});
  svg.appendChild(rect);
  const pt=svg.createSVGPoint();
  function idx(ev){pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    let best=0,bd=1e9;for(let i=0;i<n;i++){const d=Math.abs(X(i)-p.x);if(d<bd){bd=d;best=i;}}return best;}
  rect.addEventListener('mousemove',ev=>{const i=idx(ev);line.setAttribute('x1',X(i));line.setAttribute('x2',X(i));
    line.style.opacity='.5';showTip(render(i),ev);});
  rect.addEventListener('mouseleave',()=>{line.style.opacity='0';hideTip();});
  rect.addEventListener('touchstart',ev=>{const t=ev.touches[0];const i=idx(t);line.setAttribute('x1',X(i));line.setAttribute('x2',X(i));
    line.style.opacity='.5';showTip(render(i),t);},{passive:true});
}

/* ---------- 2. ความต้องการน้ำรายเดือนแยกกิจกรรม (stacked) ---------- */
function chartDemand(){

  const tot=MO.map((_,i)=>SECTORS.reduce((a,s)=>a+s.v[i],0));
  const ymax=1200, bw=Math.min(38,(w-pl-pr)/12*0.62);
  const X=i=>pl+(i+0.5)*((w-pl-pr)/12), Y=v=>h-pb-(v/ymax)*(h-pb-pt_);
  const s=svgRoot(w,h);
  for(let v=0;v<=ymax;v+=300){s.appendChild(gridline(pl,Y(v),w-pr,Y(v),v===0));
    s.appendChild(txt(pl-9,Y(v)+4,nice(v),{anchor:'end'}));}
  s.appendChild(txt(4,pt_-16,'ล้าน ลบ.ม.',{anchor:'start',size:10.5,fam:'\"Bai Jamjuree\",sans-serif'}));
  MO.forEach((m,i)=>s.appendChild(txt(X(i),h-12,m,{fam:'"IBM Plex Sans Thai",sans-serif',size:11.5})));
  MO.forEach((_,i)=>{
    let acc=0;
    SECTORS.forEach((sec,si)=>{
      const v=sec.v[i]; if(v<=0){acc+=v;return;}
      const y0=Y(acc+v), y1=Y(acc), hh=Math.max(1,y1-y0-(si?2:0));
      const r=E('rect',{x:X(i)-bw/2,y:y0,width:bw,height:hh,rx:si===SECTORS.length-1?3:0},{fill:sec.c,cursor:'pointer'});
      r.addEventListener('mouseenter',ev=>showTip(`<div class="th">${MO[i]} · ${sec.n}</div>`+
        tipRow(sec.c,'ความต้องการน้ำ',nice(v)+' ล้าน ลบ.ม.')+tipRow('','สัดส่วนของเดือน',(v/tot[i]*100).toFixed(1)+'%')+
        tipRow('','รวมทั้งเดือน',nice(tot[i])),ev));
      r.addEventListener('mousemove',ev=>showTip(TIP.innerHTML,ev));
      r.addEventListener('mouseleave',hideTip);
      s.appendChild(r); acc+=v;
    });
    // top rounded cap
    s.appendChild(txt(X(i),Y(acc)-7,nice(acc),{size:10.5,fill:'var(--ink-2)',w:500}));
  });
  const box=document.createElement('div');box.appendChild(scroller(s,720));
  box.appendChild(legend(SECTORS.map(x=>({n:x.n,c:x.c}))));
  return box;
}

  const X=i=>pl+i*((w-pl-pr)/(n-1)), Y=v=>h-pb-(v/ymax)*(h-pb-pt_);
  const s=svgRoot(w,h);
  for(let v=0;v<=ymax;v+=60){s.appendChild(gridline(pl,Y(v),w-pr,Y(v),v===0));
    s.appendChild(txt(pl-9,Y(v)+4,nice(v),{anchor:'end'}));}
  s.appendChild(txt(4,pt_-16,'ล้าน ลบ.ม./สัปดาห์',{anchor:'start',size:10.5,fam:'\"Bai Jamjuree\",sans-serif'}));

  s.appendChild(E('rect',{x:X(cut),y:pt_,width:w-pr-X(cut),height:h-pb-pt_},{fill:'var(--ink-3)',opacity:.045}));

  s.appendChild(txt(X(cut)+8,pt_+13,'▸ พยากรณ์ 12 สัปดาห์',{anchor:'start',size:11,fam:'"Bai Jamjuree",sans-serif',fill:'var(--ink-3)'}));
  const lo=[obs[cut],...INF10], hi=[obs[cut],...INF90], mid=[obs[cut],...INF50];
  let d=hi.map((v,i)=>`${i?'L':'M'}${X(cut+i)} ${Y(v)}`).join(' ');
  for(let i=lo.length-1;i>=0;i--)d+=`L${X(cut+i)} ${Y(lo[i])}`;
  s.appendChild(E('path',{d:d+'Z'},{fill:'var(--band)'}));
  s.appendChild(E('path',{d:mid.map((v,i)=>`${i?'L':'M'}${X(cut+i)} ${Y(v)}`).join(' ')},
    {fill:'none',stroke:'var(--s1)',strokeWidth:'2.2',strokeDasharray:'6 4'}));
  s.appendChild(E('path',{d:obs.map((v,i)=>`${i?'L':'M'}${X(i)} ${Y(v)}`).join(' ')},
    {fill:'none',stroke:'var(--s1)',strokeWidth:'2.4',strokeLinejoin:'round'}));
  s.appendChild(E('circle',{cx:X(cut),cy:Y(obs[cut]),r:4.5},{fill:'var(--s1)',stroke:'var(--surface)',strokeWidth:'2'}));
  const peak=INF50.indexOf(Math.max(...INF50));
  s.appendChild(txt(X(cut+1+peak),Y(INF50[peak])-11,'จุดสูงสุดคาด '+nice(INF50[peak]),{size:11,fill:'var(--ink-2)',w:500,fam:'"IBM Plex Sans Thai",sans-serif'}));
  for(let i=0;i<n;i+=2){const lab=i<=cut?`S−${cut-i}`:`S+${i-cut}`;
    s.appendChild(txt(X(i),h-20,lab,{size:10.5}));}
  s.appendChild(txt((pl+w-pr)/2,h-6,'สัปดาห์ (S−n = ย้อนหลัง, S+n = ล่วงหน้า)',{size:10.5,fam:'"IBM Plex Sans Thai",sans-serif'}));
  crosshair(s,{x0:pl,x1:w-pr,y0:pt_,y1:h-pb,n,X,render:i=>{
    if(i<=cut)return `<div class="th">สัปดาห์ S−${cut-i}</div>`+tipRow('var(--s1)','ตรวจวัดจริง',nice(obs[i])+' ล้าน ลบ.ม.');
    const j=i-cut-1;
    return `<div class="th">สัปดาห์ S+${i-cut}</div>`+tipRow('var(--s1)','พยากรณ์ P50',nice(INF50[j]))+
      tipRow('','P10 (แล้ง)',nice(INF10[j]))+tipRow('','P90 (ฝนมาก)',nice(INF90[j]));}});
  const box=document.createElement('div');box.appendChild(scroller(s,660));
  box.appendChild(legend([{n:'ตรวจวัดจริง',c:'var(--s1)',line:1},{n:'พยากรณ์ P50',c:'var(--s1)',line:1,dash:1},{n:'ช่วงเชื่อมั่น P10–P90',c:'var(--band)'}]));
  return box;
}

/* ============================================================
   ค่าที่คำนวณจากข้อมูลข้างต้น (ตรวจสอบสมดุลได้)
   ============================================================ */
let MONTH_TOT, YEAR_TOT, YTD_DEM, YTD_UNMET, YTD_COV, COV_M, CUM_UNMET;
let ACT_I, STORAGE, ACTIVE_CAP, LRC_NOW;
const MONTHS_ELAPSED = 8;   /* ม.ค.–ส.ค. — ปรับตามเดือนล่าสุดที่มีข้อมูลจริง */

/* คำนวณค่าที่ได้จากข้อมูลดิบใหม่ทั้งหมด เรียกทุกครั้งหลังโหลดข้อมูล */
function recompute(){
  if(!SAL || !SAL.length) SAL = genSAL();
  ACT_I      = ACT.reduce((k,v,i)=>v!=null?i:k,0);   /* เดือนล่าสุดที่มีข้อมูลจริง */
  STORAGE    = ACT[ACT_I];
  ACTIVE_CAP = RESERVOIRS.reduce((a,r)=>a+r.cap,0);
  LRC_NOW    = LRC[ACT_I];
  SAL_NOW   = SAL[1][SAL_FC_FROM].toFixed(2);
  MONTH_TOT = MO.map((_,i)=>SECTORS.reduce((a,s)=>a+s.v[i],0));
  YEAR_TOT  = MONTH_TOT.reduce((a,b)=>a+b,0);
  const m   = MONTHS_ELAPSED;
  YTD_DEM   = MONTH_TOT.slice(0,m).reduce((a,b)=>a+b,0);
  YTD_UNMET = UNMET_BAU.slice(0,m).reduce((a,b)=>a+b,0);
  YTD_COV   = (YTD_DEM-YTD_UNMET)/YTD_DEM*100;
  COV_M     = MO.map((_,i)=>(MONTH_TOT[i]-UNMET_BAU[i])/MONTH_TOT[i]*100);
  CUM_UNMET = UNMET_BAU.slice(0,m).map((_,i,a)=>a.slice(0,i+1).reduce((x,y)=>x+y,0));
}

     foot:(STORAGE/ACTIVE_CAP*100).toFixed(1)+'% ของความจุใช้การ · '+(STORAGE<LRC_NOW

     spark:ACT.filter(x=>x!=null), c:'var(--s1)'},
    {lab:'ความเพียงพอรวมทั้งลุ่มน้ำ (YTD)', val:YTD_COV.toFixed(1), unit:'%',

     spark:COV_M.slice(0,8), c:'var(--s3)'},
    {lab:'น้ำขาดแคลนสะสม ม.ค.–ส.ค.', val:nice(YTD_UNMET), unit:'ล้าน ลบ.ม.',
     foot:'คิดเป็น '+(YTD_UNMET/YTD_DEM*100).toFixed(1)+'% ของความต้องการ · '+pill('warn','สูงกว่าค่าเฉลี่ย 5 ปี 18%'),

    {lab:'ความเค็ม ปตร.บางนกแขวก', val:SAL[1][SAL_FC_FROM].toFixed(2), unit:'กรัม/ลิตร',
     foot:'เกณฑ์เฝ้าระวัง 0.50 g/L · '+pill('warn','เกินเกณฑ์ต่อเนื่อง 3 วัน'),
     spark:SAL[1].slice(9,SAL_FC_FROM+1), c:'var(--s2)'}
  ];
  tiles.forEach(t=>{
    const d=document.createElement('div');d.className='tile';
    d.innerHTML=`<span class="lab">${t.lab}</span>
      <div class="val">${t.val} <small>${t.unit}</small></div>
      <div class="foot">${t.foot}</div>`;

  });
}

/* ============================================================
   ชั้นเชื่อมต่อข้อมูล (Data layer)
   ------------------------------------------------------------
   ลำดับการทำงาน
     1) พยายามโหลด DATA_URL ก่อนเสมอ
     2) ถ้าโหลดไม่ได้ / รูปแบบไม่ถูกต้อง จะถอยกลับไปใช้ชุดข้อมูลจำลองด้านบน
        (หน้าเว็บจึงไม่มีวันพัง แม้ระบบต้นทางล่ม)
   การต่อข้อมูลจริง
     - วาง data.json ไว้ข้าง index.html  → ใช้ค่าเริ่มต้นได้เลย
     - หรือเปลี่ยน DATA_URL เป็น URL ของ API  → API ต้องเป็น https และตั้ง
       Access-Control-Allow-Origin ให้โดเมนที่ใช้เผยแพร่หน้านี้
     - ห้ามใส่ API key ไว้ในไฟล์นี้ ถ้า repository เป็นสาธารณะ (ดู README)
   ============================================================ */
const DATA_URL = 'data.json';
const REFRESH_MINUTES = 0;   /* 0 = ไม่ดึงซ้ำ · ใส่ 15 เพื่อรีเฟรชทุก 15 นาที */

/* ชุดข้อมูลที่ data.json เขียนทับได้ — คีย์ใน JSON ต้องตรงกับชื่อเหล่านี้ */
const SETTERS = {
  SECTORS:  v=>SECTORS=v,   UNMET_BAU:v=>UNMET_BAU=v, UNMET_AI:v=>UNMET_AI=v,
  URC:      v=>URC=v,       LRC:      v=>LRC=v,       ACT:      v=>ACT=v,
  F10:      v=>F10=v,       F50:      v=>F50=v,       F90:      v=>F90=v,
  SITES:    v=>SITES=v,     SCEN:     v=>SCEN=v,      ZONES:    v=>ZONES=v,
  INFLOW_OBS:v=>INFLOW_OBS=v, INF10:  v=>INF10=v,     INF50:    v=>INF50=v, INF90:v=>INF90=v,
  SAL_ST:   v=>SAL_ST=v,    SAL:      v=>SAL=v,       SAL_FC_FROM:v=>SAL_FC_FROM=v,
  RESERVOIRS:v=>RESERVOIRS=v
};

function applyData(d){
  let n=0;
  for(const k in SETTERS){ if(d[k]!=null){ SETTERS[k](d[k]); n++; } }
  if(d.SAL==null) SAL=null;   /* ไม่ได้ส่งชุดความเค็มมา → สร้างใหม่จากสถานีที่มี */
  return n;
}

async function loadData(){
  try{
    const res = await fetch(DATA_URL,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d = await res.json();
    const n = applyData(d);
    if(!n) throw new Error('ไม่พบชุดข้อมูลที่รู้จักในไฟล์');
    return {live:true, asOf:d.asOf||null, fields:n};
  }catch(err){
    console.info('[แม่กลอง DSS] ใช้ข้อมูลจำลองในตัว —', err.message);
    return {live:false, reason:err.message};
  }
}

function stampSource(src){
  const badge=document.getElementById('srcBadge'), stamp=document.getElementById('srcStamp');
  if(!src.live) return;
  badge.textContent='ข้อมูลจริง · '+src.fields+' ชุดข้อมูล';
  badge.style.borderStyle='solid';
  if(src.asOf) stamp.innerHTML='ข้อมูล ณ <b>'+src.asOf+'</b>';
}

async function build(){
  const src = await loadData();
  recompute();
  stampSource(src);
  buildStrip();
  const tabHost=document.getElementById('tabs'), panelHost=document.getElementById('panels');
  TABS.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='tab';b.type='button';b.role='tab';b.id='tab-'+i;
    b.setAttribute('aria-selected',i===0);b.setAttribute('aria-controls','panel-'+i);
    b.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span>${t.n}`;
    b.addEventListener('click',()=>select(i));
    tabHost.appendChild(b);
    const p=document.createElement('div');
    p.className='panel';p.id='panel-'+i;p.setAttribute('role','tabpanel');p.setAttribute('aria-labelledby','tab-'+i);
    p.hidden=i!==0;p.innerHTML=t.build();
    panelHost.appendChild(p);
  });
  document.getElementById('c-schem').appendChild(chartSchematic());
  document.getElementById('c-rule').appendChild(chartRuleCurve());
  document.getElementById('c-dem').appendChild(chartDemand());
  document.getElementById('c-unmet').appendChild(chartUnmet());
  document.getElementById('c-cov').appendChild(chartCoverage());
  document.getElementById('c-inflow').appendChild(chartInflow());
  document.getElementById('c-trade').appendChild(chartTradeoff());
  document.getElementById('c-sal').appendChild(chartSalinity());
  document.getElementById('c-iso').appendChild(chartIsohaline());
  document.getElementById('c-arch').appendChild(chartArch());
  buildDemandTable();
  wireDemandToggle();
  wireScenario();
  wireCopilot();
  const h=location.hash.match(/^#t([0-5])$/);   /* เปิดแท็บตามลิงก์ที่ส่งต่อกันได้ */
  if(h) select(+h[1]);
  if(REFRESH_MINUTES>0) setInterval(()=>location.reload(), REFRESH_MINUTES*60000);
}
function select(i){
  history.replaceState(null,'','#t'+i);
  document.querySelectorAll('.tab').forEach((b,j)=>b.setAttribute('aria-selected',j===i));
  document.querySelectorAll('.panel').forEach((p,j)=>p.hidden=j!==i);
  hideTip();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ห้องทดลองทางเลือก */
function wireScenario(){
  const seg=document.getElementById('seg-scen');
  const tb=document.querySelector('#scen-tbl tbody');
  tb.innerHTML=SCEN.map((s,i)=>`<tr data-i="${i}"><td><span class="swatch" style="background:${s.c}"></span>${s.id} · ${s.n}</td>
    <td class="n">${nice(s.unmet)}</td><td class="n">${s.cov.toFixed(1)}</td>
    <td class="n">${s.sal}</td><td class="n">${nice(s.carry)}</td></tr>`).join('');
  function render(i){
    const s=SCEN[i], base=SCEN[0];
    document.getElementById('scen-name').textContent=s.id+' · '+s.n;
    const d=(v,b,inv,dp=0)=>{const diff=v-b;if(i===0)return '<span style="color:var(--ink-3)">ทางเลือกอ้างอิง</span>';
      const better=inv?diff<0:diff>0;
      const txt2=(diff>0?'+':'−')+Math.abs(diff).toLocaleString('th-TH',{minimumFractionDigits:dp,maximumFractionDigits:dp});
      return `<span style="color:${better?'var(--good-ink)':'var(--crit-ink)'}">${txt2} เทียบ S0</span>`;};
    const cells=[
      ['น้ำขาดแคลนทั้งปี',nice(s.unmet),'ล้าน ลบ.ม.',d(s.unmet,base.unmet,true)],
      ['ความเพียงพอรวม',s.cov.toFixed(1),'%',d(s.cov,base.cov,false,1)],
      ['วันความเค็มเกินเกณฑ์',s.sal,'วัน/ปี',d(s.sal,base.sal,true)],
      ['มูลค่าผลผลิตที่สูญเสีย',nice(s.loss),'ล้านบาท',d(s.loss,base.loss,true)],
      ['น้ำต้นทุนคงเหลือ 1 พ.ค. 70',nice(s.carry),'ล้าน ลบ.ม.',d(s.carry,base.carry,false)],
      ['น้ำขาดแคลนภาคเกษตร',nice(s.agri),'ล้าน ลบ.ม.',d(s.agri,base.agri,true)]
    ];
    document.getElementById('scen-kpi').innerHTML=cells.map(c=>`
      <div style="background:var(--surface);padding:13px 15px">
        <div style="font-family:'Bai Jamjuree',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)">${c[0]}</div>
        <div class="num" style="font-size:25px;font-weight:500;letter-spacing:-.02em;line-height:1.2">${c[1]} <small style="font-size:12.5px;color:var(--ink-2)">${c[2]}</small></div>
        <div style="font-size:12px;margin-top:1px">${c[3]}</div>
      </div>`).join('');
    tb.querySelectorAll('tr').forEach((r,j)=>r.classList.toggle('hl',j===i));
  }
  seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render(+b.dataset.i);});
  tb.addEventListener('click',e=>{const r=e.target.closest('tr');if(!r)return;
    const i=+r.dataset.i;seg.querySelectorAll('button').forEach((x,j)=>x.setAttribute('aria-pressed',j===i));render(i);});
  render(1);
}

function wireCopilot(){
  const btn=document.getElementById('copBtn'), cop=document.getElementById('cop'),
        scrim=document.getElementById('scrim'), body=document.getElementById('copBody'), f=document.getElementById('copF');
  const add=(cls,html)=>{const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;
    body.appendChild(d);body.scrollTop=body.scrollHeight;return d;};
  add('a',`<p>สวัสดีครับ ผมเชื่อมกับผลจำลอง WEAP ชุดล่าสุดและเอกสารแผนแม่บทลุ่มน้ำแม่กลองไว้แล้ว ถามเป็นภาษาไทยได้เลยครับ</p>
    <div class="src">ตัวอย่างการสนทนาในหน้าจำลอง — คำตอบด้านล่างเป็นชุดที่เตรียมไว้เพื่อสาธิตรูปแบบการตอบ</div>`);
  f.innerHTML=QA.map((x,i)=>`<button class="chipq" data-i="${i}">${x.q}</button>`).join('');
  f.addEventListener('click',e=>{const b=e.target.closest('.chipq');if(!b)return;
    const x=QA[+b.dataset.i];b.remove();
    add('u',x.q);
    const t=add('a','<span style="color:var(--ink-3)">กำลังค้นผลจำลอง…</span>');
    setTimeout(()=>{t.innerHTML=x.a;body.scrollTop=body.scrollHeight;},520);});
  const open=v=>{cop.classList.toggle('open',v);scrim.classList.toggle('open',v);
    cop.setAttribute('aria-hidden',!v);btn.setAttribute('aria-expanded',v);};
  btn.addEventListener('click',()=>open(true));
  document.getElementById('copX').addEventListener('click',()=>open(false));
  scrim.addEventListener('click',()=>open(false));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')open(false);});
}

build();
</script>
